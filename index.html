<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ma Cuisine</title><meta name="theme-color" content="#12a05c"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#f7f7f3;--card:#fff;--ink:#16211b;--mut:#6b7a71;--ac:#12a05c;--hi:#e11d48;--ln:#e5e8e1;--r:18px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1612;--card:#18221c;--ink:#eaf2ec;--mut:#98a89e;--ac:#3ccf86;--hi:#fb7185;--ln:#26332b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Avenir Next','Segoe UI',system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:760px;margin:auto;padding:14px}h1{font-size:26px;margin:4px 0 12px;letter-spacing:-.5px}h2{font-size:18px;margin:18px 0 8px}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
button{border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}button.g{background:var(--card);color:var(--ink);border:1px solid var(--ln)}button.d{background:var(--hi)}button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:0 0 auto}.row>input{flex:1 1 140px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--ln);padding:6px 12px;border-radius:99px;font-weight:500}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--ln);cursor:pointer;text-align:left;padding:0;color:var(--ink)}
.card img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--ln);display:flex;align-items:center;justify-content:center;font-size:40px}.card div.t{padding:8px 10px}.card b{display:block}.mut{color:var(--mut);font-size:14px}
.hero{width:100%;max-height:300px;object-fit:cover;border-radius:var(--r)}.box{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin:8px 0}
.stp{display:flex;align-items:center;gap:12px}.stp b{font-size:20px;min-width:90px;text-align:center}
li{margin:6px 0}.ir{display:grid;grid-template-columns:64px 1fr 1fr 32px;gap:6px;margin:6px 0}.ir .nm{grid-column:1/4}.ir .ry{grid-column:1/4}.ir button{grid-row:1;grid-column:4;padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}nav button.on{color:var(--ac)}
.shop label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.shop input{width:22px;height:22px;flex:none}.done{text-decoration:line-through;opacity:.5}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}#toast.s{opacity:1}
.cook{position:fixed;inset:0;background:var(--bg);z-index:9;padding:20px;display:flex;flex-direction:column;gap:16px}.cook p{font-size:26px;line-height:1.35;flex:1;overflow:auto}
.sg{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}.sg:empty{display:none}.sgi{display:flex;justify-content:space-between;gap:8px;text-align:left}.sgn{color:var(--ac);font-weight:700}

.top{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;margin:0 0 14px}.top b{font-size:18px}.top .ib{position:absolute;right:-6px}.logo{width:34px;height:34px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center}
.ib{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:50%;background:none;color:var(--ink)}.ib.w{background:rgba(255,255,255,.92);color:#16211b;box-shadow:0 2px 10px rgba(0,0,0,.2)}.ib.fv{color:var(--hi)}
.sr{display:flex;gap:10px;align-items:center;margin-bottom:12px}.srch{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:0 12px;color:var(--mut)}.srch input{border:0;background:none;padding:12px 0;color:var(--ink)}.srch input:focus-visible{outline:0}.srch:focus-within{border-color:var(--ac)}
.fb{background:none;color:var(--ink);display:flex;align-items:center;gap:6px;padding:8px 2px;font-weight:600}.fb.on{color:var(--ac)}.fb i{background:var(--ac);color:#fff;border-radius:99px;font-style:normal;font-size:12px;padding:1px 7px}
.grid{gap:20px 14px}.card{background:none;border:0;border-radius:0;overflow:visible;position:relative;color:var(--ink)}.card img,.card .ph{aspect-ratio:1/1.05;border-radius:20px;background:linear-gradient(135deg,var(--ln),var(--bg))}.card b{display:block;margin:8px 2px 0;font-weight:600;line-height:1.25}.card .mut{display:block;margin:2px 2px 0}.hb{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--hi);display:grid;place-items:center}
.hero2{position:relative;margin:-14px -14px 0}.hero2 img,.hero2 .ph{width:100%;height:300px;object-fit:cover;border-radius:0 0 28px 28px}.hbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px}
.sheet h1{font-size:28px;margin:16px 0 2px}.stars{display:flex;align-items:center;gap:0;margin:0 0 6px -6px}.ib.s{width:34px;height:34px;color:#f5b301}.ib.s:not(.on){color:var(--mut)}.stars .mut{margin-left:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.pills span{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--ln);padding:5px 11px;border-radius:99px;font-size:14px}
.il{list-style:none;padding:0;margin:0}.il li{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--ln)}.il b{white-space:nowrap}
.st{list-style:none;counter-reset:s;padding:0;margin:0}.st li{counter-increment:s;display:flex;gap:12px;margin:16px 0}.st li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.big{width:100%;display:flex;gap:8px;align-items:center;justify-content:center;padding:15px;border-radius:16px;font-size:17px}
nav{box-shadow:0 -4px 20px rgba(0,0,0,.05)}nav button{font-size:11.5px;padding:8px 2px 10px}.ic{display:grid;place-items:center;width:56px;height:32px;border-radius:99px;margin:0 auto 2px}nav .on .ic{background:color-mix(in srgb,var(--ac) 18%,transparent)}nav button.fab{flex:0 0 56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;margin:-20px 10px 0;padding:0;display:grid;place-items:center;box-shadow:0 6px 18px rgba(18,160,92,.45)}
.ov{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 30px}.ov .srch{margin:8px 0 6px;padding:2px 12px}.prow{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--ln);border-radius:16px;padding:8px 12px 8px 8px;margin:8px 0;text-align:left}.prow img,.prow .ph{width:56px;height:56px;aspect-ratio:auto;border-radius:12px;object-fit:cover;flex:none;font-size:26px}.prow>span{flex:1;display:flex;flex-direction:column}.prow svg{color:var(--ac);flex:none}
.gr{display:grid;grid-template-columns:minmax(0,1fr) 112px 34px 34px;gap:6px;align-items:center;margin:6px 0}.gr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gr select{width:100%;padding:8px 6px;font-size:13px;text-overflow:ellipsis}.gr button{width:34px;height:34px;padding:0}.nw{flex-wrap:nowrap}.nw b{white-space:nowrap}
.dlg{z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}.dbox{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}.dbox .row{justify-content:flex-end;margin:0}
.dh{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-radius:0;padding:0 0 8px;color:var(--ink);font-size:18px}.dh .add{display:flex;align-items:center;gap:4px;color:var(--ac);font-size:15px;font-weight:600}.pe{display:flex;gap:12px;padding:12px 0 4px;border-top:1px solid var(--ln)}.pt{flex:none;width:76px;height:76px;padding:0;border-radius:16px;overflow:hidden;background:var(--ln);display:grid;place-items:center;font-size:30px}.pt img{width:100%;height:100%;object-fit:cover}.pm{flex:1;min-width:0;display:flex;flex-direction:column}.pnm{background:none;color:var(--ink);padding:0;border-radius:0;text-align:left;font-weight:700;font-size:17px;line-height:1.25}.sm{width:36px;height:36px;padding:0}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script>
addEventListener('error',e=>{const a=document.getElementById('app');if(a&&!a.innerHTML.trim())a.innerHTML='<p style="padding:20px">⚠️ Erreur : '+String(e.message).replace(/</g,'&lt;')+'</p><p style="padding:0 20px"><button onclick="location.reload()">Recharger</button></p>'});
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SE=['Printemps','Été','Automne','Hiver'],RAY=['Fruits & légumes','Viandes & poissons','Crèmerie','Épicerie','Boulangerie','Surgelés','Autre'],UN=['','g','kg','ml','cl','L','c. à café','c. à soupe','pièce','pincée'],DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'],MODES=['Casserole','Poêle','Four','Micro-ondes','Vapeur','Barbecue','Autre'];
const m=new Date().getMonth(),NOW=SE[m>=2&&m<=4?0:m<=7&&m>=5?1:m>=8&&m<=10?2:3];
let db={recipes:[],shop:[],plan:{}},cfg={},sha=null,tm=null;
try{db=JSON.parse(localStorage.db)}catch(e){}try{cfg=JSON.parse(localStorage.cfg)}catch(e){}sha=localStorage.sha||null;
const st={tab:'r',q:'',se:NOW,fav:false,fl:false,ig:[],tag:'',fr:'',cur:null,n:4,edit:null,cook:null};
const rec=id=>db.recipes.find(r=>r.id==id),fmt=x=>+(+x).toFixed(2),opts=(a,v)=>a.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('');
function msg(t){const e=$('#toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',2200)}
/* ---- stockage local + GitHub ---- */
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const api=()=>`https://api.github.com/repos/${cfg.repo}/contents/${cfg.path||'recettes.json'}`,H=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});
const ok=()=>cfg.token&&cfg.repo;let tmr;
function cache(){try{localStorage.db=JSON.stringify(db);localStorage.sha=sha||''}catch(e){msg('Stockage local plein')}}
let dirty=localStorage.dirty=='1';
function save(){dirty=true;localStorage.dirty='1';cache();clearTimeout(tmr);if(ok())tmr=setTimeout(push,1500)}
const busy=()=>st.edit||st.cook!=null||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
async function pull(q){if(!ok())return;if(dirty)return push(0,q);try{const r=await fetch(api(),{headers:H(),cache:'no-store'});if(r.status==404){sha=null;return push(0,q)}if(!r.ok)throw 0;const j=await r.json();if(j.sha==sha){q||msg('Déjà à jour');return}sha=j.sha;db=JSON.parse(j.content?dec(j.content):await(await fetch(j.download_url)).text());norm();cache();msg('Données mises à jour depuis GitHub');if(!busy())render()}catch(e){q||msg('Synchro impossible (hors-ligne ?)')}}
async function push(n=0,q){try{const r=await fetch(api(),{method:'PUT',headers:H(),body:JSON.stringify({message:'maj recettes',content:enc(JSON.stringify(db)),sha:sha||undefined})});
if((r.status==409||r.status==422)&&n<2){const g=await(await fetch(api(),{headers:H(),cache:'no-store'})).json();const o=JSON.parse(g.content?dec(g.content):'{}');sha=g.sha;const has=(a,id)=>a.some(x=>x.id==id);(o.recipes||[]).forEach(x=>has(db.recipes,x.id)||db.recipes.push(x));(o.shop||[]).forEach(x=>has(db.shop,x.id)||db.shop.push(x));(o.ing||[]).forEach(x=>ing(x.name)||db.ing.push(x));norm();return push(n+1,q)}
if(!r.ok)throw 0;sha=(await r.json()).content.sha;dirty=false;localStorage.dirty='0';cache();q||msg('Sauvegardé sur GitHub')}catch(e){q||msg('Échec de la sauvegarde GitHub (nouvel essai à la reconnexion)')}}
/* ---- catalogue d'ingrédients ---- */
const pvHtml=p=>p?`<img class="hero" src="${p}" alt=""><div class="row"><button class="g" data-a="delp">🗑 Retirer la photo</button></div>`:'';
const cuiTxt=r=>(r.cuis||[]).map(c=>(c.mode=='Autre'?'':c.mode+' ')+c.min+' min').join(' puis ');
const cuiRow=c=>`<div class="row cr"><select class="cm" style="width:auto">${opts(MODES,c.mode)}</select><input class="cn" type="number" min="0" inputmode="numeric" placeholder="Durée" value="${c.min||''}" style="flex:0 0 90px"><span class="mut">min</span><button class="g" data-a="delc">✕</button></div>`;
const nz=s=>String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe');
function igSugg(v){const q=nz(v),z=$('#igs');if(!z)return;if(!q){z.innerHTML='';return}const c={};db.recipes.forEach(r=>r.ing.forEach(i=>{const k=nz(i.name);if(k.includes(q)&&!st.ig.some(n=>nz(n)==k)){c[k]=c[k]||{n:i.name,c:0};c[k].c++}}));
const m=Object.values(c).sort((a,b)=>b.c-a.c||a.n.localeCompare(b.n,'fr')).slice(0,6);
z.innerHTML=m.map(x=>`<button type="button" class="g sgi" data-a="igadd" data-v="${esc(x.n)}"><span>${esc(x.n)}</span><span class="mut">${x.c} recette${x.c>1?'s':''}</span></button>`).join('')||'<p class="mut" style="margin:4px 0">Aucune recette avec cet ingrédient.</p>'}
function sugg(t){const q=nz(t.value),b=t.parentNode.querySelector('.sg');if(!q){b.innerHTML='';return}
const m=db.ing.filter(x=>nz(x.name).includes(q)).sort((a,c)=>(nz(c.name).startsWith(q)-nz(a.name).startsWith(q))||a.name.localeCompare(c.name,'fr')).slice(0,5);
b.innerHTML=m.map(x=>`<button type="button" class="g sgi" data-a="pick" data-v="${esc(x.name)}"><span>${esc(x.name)}</span><span class="mut">${esc(x.ray)}</span></button>`).join('')+(ing(t.value)?'':`<button type="button" class="g sgi sgn" data-a="mk" data-v="${esc(t.value.trim())}">➕ Créer « ${esc(t.value.trim())} »</button>`)}
function ing(n){n=nz(n);return db.ing.find(x=>nz(x.name)==n)}
const dlOpts=()=>db.ing.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(x=>`<option value="${esc(x.name)}">`).join('');
function norm(){db.ing=db.ing||[];const seen=new Set();db.ing.forEach(x=>{if(!x.id||seen.has(x.id))x.id=uid();seen.add(x.id);if(!RAY.includes(x.ray))x.ray='Autre'});db.recipes.forEach(r=>{if(!r.cuis)r.cuis=r.time?[{mode:'Autre',min:r.time}]:[]});db.recipes.forEach(r=>r.ing.forEach(i=>{if(i.name&&!ing(i.name))db.ing.push({id:uid(),name:i.name.trim(),ray:i.ray||'Autre'})}))}
function ask(o){return new Promise(res=>{const e=document.createElement('div');e.className='ov dlg';e.innerHTML=`<div class="dbox"><b>${esc(o.t)}</b>${o.m?`<p class="mut" style="margin:0">${esc(o.m)}</p>`:''}${o.i!==undefined?`<input id="dI" value="${esc(o.i)}" placeholder="${esc(o.ph||'')}" autocomplete="off">`:''}${o.s?`<select id="dS">${opts(o.s,o.sv)}</select>`:''}<div class="row"><button class="g" data-k="0">Annuler</button><button class="${o.d?'d':''}" data-k="1">${esc(o.ok||'OK')}</button></div></div>`;document.body.append(e);const I=e.querySelector('#dI'),S=e.querySelector('#dS');if(I){I.focus();I.addEventListener('keydown',v=>{if(v.key=='Enter')e.querySelector('[data-k="1"]').click()})}e.onclick=v=>{const k=v.target.dataset.k;if(k===undefined)return;const r={i:I?I.value.trim():'',s:S?S.value:''};e.remove();res(k=='1'?r:null)}})}
async function newIng(n,m){if(!n){const r=await ask({t:'Nouvel ingrédient',i:'',ph:'Nom (ex : Courgette)',ok:'Suivant'});if(!r||!r.i)return null;n=r.i}let x=ing(n);if(x)return x;const r=await ask({t:'Rayon de « '+n+' »',m:m||'',s:RAY,sv:'Autre',ok:'Ajouter'});if(!r)return null;x={id:uid(),name:n,ray:r.s};db.ing.push(x);save();return x}
const ingOpts=v=>'<option value="">— Ingrédient —</option>'+db.ing.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(x=>`<option ${x.name==v?'selected':''}>${esc(x.name)}</option>`).join('')+'<option value="__new">➕ Nouvel ingrédient…</option>';
/* ---- logique ---- */
function addShop(r,n){const f=n/r.base;r.ing.forEach(i=>{const k=i.name.trim().toLowerCase(),x=db.shop.find(s=>s.k==k&&s.unit==i.unit&&!s.done);if(x)x.qty+=i.qty*f;else db.shop.push({id:uid(),k,name:i.name,unit:i.unit,qty:i.qty*f,ray:(ing(i.name)||{}).ray||'Autre',done:false})})}

gdel:async v=>{const x=db.ing.find(y=>y.id==v);if(db.recipes.some(q=>q.ing.some(i=>i.name==x.name)))return msg('Utilisé dans une recette : retire-le d\'abord');if(await ask({t:'Supprimer « '+x.name+' » ?',ok:'Supprimer',d:1})){db.ing=db.ing.filter(y=>y!==x);save();render()}},
hist:async()=>{if(!ok())return msg("Configure d'abord GitHub");try{const r=await fetch(`https://api.github.com/repos/${cfg.repo}/commits?path=${encodeURIComponent(cfg.path||'recettes.json')}&per_page=10`,{headers:H()});if(!r.ok)throw 0;const l=await r.json();$('#hs').innerHTML=l.map(c=>`<div class="row"><span style="flex:1">${new Date(c.commit.committer.date).toLocaleString('fr-FR')}</span><button class="g" data-a="rest" data-v="${c.sha}">Restaurer</button></div>`).join('')||'<p class="mut">Aucun historique.</p>'}catch(e){msg('Historique indisponible')}},
rest:async v=>{if(!await ask({t:'Restaurer cette version ?',m:'Les données actuelles seront remplacées.',ok:'Restaurer'}))return;try{const r=await fetch(api()+'?ref='+v,{headers:{...H(),Accept:'application/vnd.github.raw+json'}});if(!r.ok)throw 0;const d=JSON.parse(await r.text());if(!Array.isArray(d.recipes))throw 0;db=d;norm();save();msg('Version restaurée');render()}catch(e){msg('Restauration impossible')}},
exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='recettes.json';a.click()},
cook:()=>{st.cook=0;navigator.wakeLock?.request('screen').then(w=>wl=w).catch(()=>{});cookView()},cp:()=>{st.cook--;cookView()},cn:()=>{st.cook++;cookView()},cend:()=>{st.cook=null;$('#ck')?.remove();wl?.release();clearInterval(tm)},
timer:v=>{clearInterval(tm);let s=v*60;const t=()=>{const e=$('#tm');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s--<=0){clearInterval(tm);navigator.vibrate?.([300,150,300,150,300]);msg('⏰ Minuteur terminé !')}};t();tm=setInterval(t,1000)}};

document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.i=='ingin'){const t=e.target;setTimeout(()=>t.scrollIntoView({block:'start',behavior:'smooth'}),300)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.v,b)});
document.addEventListener('input',e=>{const i=e.target.dataset.i;if(i=='ingin')sugg(e.target);if(i=='pq'){st.pq=e.target.value;$('#pl').innerHTML=pickList()}if(i=='igq')igSugg(e.target.value);if(i=='q'||i=='fr'){st[i]=e.target.value;$('#lst').innerHTML=vGrid()}if(i=='note'){rec(st.cur).note=e.target.value;save()}});
document.addEventListener('change',e=>{const t=e.target,i=t.dataset.i;if(i=='plan'&&t.value){(db.plan[t.value]=db.plan[t.value]||[]).push({id:st.cur,n:st.n});save();msg('Planifié : '+t.value);t.value=''}
if(i=='ingin'){const x=ing(t.value);if(x)t.value=x.name}
if(i=='gray'){const x=db.ing.find(y=>y.id==t.dataset.v);x.ray=t.value;db.shop.forEach(s=>{if(s.name==x.name)s.ray=t.value});save();msg('Rayon modifié')}
if(i=='chk'){const s=db.shop.find(x=>x.id==t.dataset.v);s.done=t.checked;save();render()}
if(i=='photo'&&t.files[0]){const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,640/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);st.edit.photo=c.toDataURL('image/jpeg',.65);$('#pv').innerHTML=pvHtml(st.edit.photo)};im.src=URL.createObjectURL(t.files[0])}
if(i=='imp'&&t.files[0]){t.files[0].text().then(async x=>{try{const d=JSON.parse(x);if(Array.isArray(d.ing)&&!(d.recipes||[]).length){let n=0;d.ing.forEach(y=>{if(y.name&&!ing(y.name)){db.ing.push({id:uid(),name:y.name.trim(),ray:RAY.includes(y.ray)?y.ray:'Autre'});n++}});save();msg(n+' ingrédients ajoutés');t.value='';return render()}if(!Array.isArray(d.recipes))throw 0;if(!await ask({t:'Importer ce fichier ?',m:'Toutes les données actuelles seront remplacées.',ok:'Importer',d:1}))return;db=d;norm();save();msg('Import réussi');render()}catch(_){msg('Fichier invalide')}})}});

let av;async function chk(){try{const t=await(await fetch('index.html',{cache:'no-store'})).text();let x=0;for(let i=0;i<t.length;i++)x=(x*31+t.charCodeAt(i))|0;if(av===undefined)av=x;else if(av!==x&&!busy()&&!dirty)location.reload()}catch(e){}}
chk();setInterval(chk,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull(1);chk()}});
