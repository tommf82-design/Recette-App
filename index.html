<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ma Cuisine</title><meta name="theme-color" content="#2f7d4f"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#f2f6f0;--card:#fff;--ink:#1d2b24;--mut:#66756d;--ac:#2f7d4f;--hi:#c2255c;--ln:#dde5dc;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1b2620;--ink:#e9f1ec;--mut:#9aaba1;--ac:#5fc08a;--hi:#f06595;--ln:#2b3a32}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Avenir Next','Segoe UI',system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:760px;margin:auto;padding:14px}h1{font-size:26px;margin:4px 0 12px;letter-spacing:-.5px}h2{font-size:18px;margin:18px 0 8px}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
button{border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}button.g{background:var(--card);color:var(--ink);border:1px solid var(--ln)}button.d{background:var(--hi)}button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:0 0 auto}.row>input{flex:1 1 140px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--ln);padding:6px 12px;border-radius:99px;font-weight:500}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--ln);cursor:pointer;text-align:left;padding:0;color:var(--ink)}
.card img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--ln);display:flex;align-items:center;justify-content:center;font-size:40px}.card div.t{padding:8px 10px}.card b{display:block}.mut{color:var(--mut);font-size:14px}
.hero{width:100%;max-height:300px;object-fit:cover;border-radius:var(--r)}.box{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin:8px 0}
.stp{display:flex;align-items:center;gap:12px}.stp b{font-size:20px;min-width:90px;text-align:center}
li{margin:6px 0}.ir{display:grid;grid-template-columns:64px 1fr 1fr 32px;gap:6px;margin:6px 0}.ir .nm{grid-column:1/4}.ir .ry{grid-column:1/4}.ir button{grid-row:1;grid-column:4;padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}nav button.on{color:var(--ac)}
.shop label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.shop input{width:22px;height:22px;flex:none}.done{text-decoration:line-through;opacity:.5}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}#toast.s{opacity:1}
.cook{position:fixed;inset:0;background:var(--bg);z-index:9;padding:20px;display:flex;flex-direction:column;gap:16px}.cook p{font-size:26px;line-height:1.35;flex:1;overflow:auto}
.sg{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}.sg:empty{display:none}.sgi{display:flex;justify-content:space-between;gap:8px;text-align:left}.sgn{color:var(--ac);font-weight:700}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SE=['Printemps','Été','Automne','Hiver'],RAY=['Fruits & légumes','Viandes & poissons','Crèmerie','Épicerie','Boulangerie','Surgelés','Autre'],UN=['','g','kg','ml','cl','L','c. à café','c. à soupe','pièce','pincée'],DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'],MODES=['Casserole','Poêle','Four','Micro-ondes','Barbecue','Autre'];
const m=new Date().getMonth(),NOW=SE[m>=2&&m<=4?0:m<=7&&m>=5?1:m>=8&&m<=10?2:3];
let db={recipes:[],shop:[],plan:{}},cfg={},sha=null,tm=null;
try{db=JSON.parse(localStorage.db)}catch(e){}try{cfg=JSON.parse(localStorage.cfg)}catch(e){}sha=localStorage.sha||null;norm();
const st={tab:'r',q:'',se:NOW,fav:false,tag:'',fr:'',cur:null,n:4,edit:null,cook:null};
const rec=id=>db.recipes.find(r=>r.id==id),fmt=x=>+(+x).toFixed(2),opts=(a,v)=>a.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('');
function msg(t){const e=$('#toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',2200)}
/* ---- stockage local + GitHub ---- */
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const api=()=>`https://api.github.com/repos/${cfg.repo}/contents/${cfg.path||'recettes.json'}`,H=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});
const ok=()=>cfg.token&&cfg.repo;let tmr;
function cache(){try{localStorage.db=JSON.stringify(db);localStorage.sha=sha||''}catch(e){msg('Stockage local plein')}}
let dirty=localStorage.dirty=='1';
function save(){dirty=true;localStorage.dirty='1';cache();clearTimeout(tmr);if(ok())tmr=setTimeout(push,1500)}
const busy=()=>st.edit||st.cook!=null||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
async function pull(q){if(!ok())return;if(dirty)return push(0,q);try{const r=await fetch(api(),{headers:H(),cache:'no-store'});if(r.status==404){sha=null;return push(0,q)}if(!r.ok)throw 0;const j=await r.json();if(j.sha==sha){q||msg('Déjà à jour');return}sha=j.sha;db=JSON.parse(j.content?dec(j.content):await(await fetch(j.download_url)).text());norm();cache();msg('Données mises à jour depuis GitHub');if(!busy())render()}catch(e){q||msg('Synchro impossible (hors-ligne ?)')}}
async function push(n=0,q){try{const r=await fetch(api(),{method:'PUT',headers:H(),body:JSON.stringify({message:'maj recettes',content:enc(JSON.stringify(db)),sha:sha||undefined})});
if((r.status==409||r.status==422)&&n<2){const g=await(await fetch(api(),{headers:H(),cache:'no-store'})).json();const o=JSON.parse(g.content?dec(g.content):'{}');sha=g.sha;const has=(a,id)=>a.some(x=>x.id==id);(o.recipes||[]).forEach(x=>has(db.recipes,x.id)||db.recipes.push(x));(o.shop||[]).forEach(x=>has(db.shop,x.id)||db.shop.push(x));(o.ing||[]).forEach(x=>ing(x.name)||db.ing.push(x));norm();return push(n+1,q)}
if(!r.ok)throw 0;sha=(await r.json()).content.sha;dirty=false;localStorage.dirty='0';cache();q||msg('Sauvegardé sur GitHub')}catch(e){q||msg('Échec de la sauvegarde GitHub (nouvel essai à la reconnexion)')}}
/* ---- catalogue d'ingrédients ---- */
const pvHtml=p=>p?`<img class="hero" src="${p}" alt=""><div class="row"><button class="g" data-a="delp">🗑 Retirer la photo</button></div>`:'';
const cuiTxt=r=>(r.cuis||[]).map(c=>(c.mode=='Autre'?'':c.mode+' ')+c.min+' min').join(' puis ');
const cuiRow=c=>`<div class="row cr"><select class="cm" style="width:auto">${opts(MODES,c.mode)}</select><input class="cn" type="number" min="0" inputmode="numeric" placeholder="Durée" value="${c.min||''}" style="flex:0 0 90px"><span class="mut">min</span><button class="g" data-a="delc">✕</button></div>`;
const nz=s=>String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe');
function sugg(t){const q=nz(t.value),b=t.parentNode.querySelector('.sg');if(!q){b.innerHTML='';return}
const m=db.ing.filter(x=>nz(x.name).includes(q)).sort((a,c)=>(nz(c.name).startsWith(q)-nz(a.name).startsWith(q))||a.name.localeCompare(c.name,'fr')).slice(0,5);
b.innerHTML=m.map(x=>`<button type="button" class="g sgi" data-a="pick" data-v="${esc(x.name)}"><span>${esc(x.name)}</span><span class="mut">${esc(x.ray)}</span></button>`).join('')+(ing(t.value)?'':`<button type="button" class="g sgi sgn" data-a="mk" data-v="${esc(t.value.trim())}">➕ Créer « ${esc(t.value.trim())} »</button>`)}
function ing(n){n=nz(n);return db.ing.find(x=>nz(x.name)==n)}
const dlOpts=()=>db.ing.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(x=>`<option value="${esc(x.name)}">`).join('');
function norm(){db.ing=db.ing||[];db.recipes.forEach(r=>{if(!r.cuis)r.cuis=r.time?[{mode:'Autre',min:r.time}]:[]});db.recipes.forEach(r=>r.ing.forEach(i=>{if(i.name&&!ing(i.name))db.ing.push({id:uid(),name:i.name.trim(),ray:i.ray||'Autre'})}))}
function newIng(n){n=(n||prompt('Nom du nouvel ingrédient ?')||'').trim();if(!n)return null;let x=ing(n);if(x)return x;const k=parseInt(prompt('Rayon ?\n'+RAY.map((r,i)=>(i+1)+' = '+r).join('\n')+'\n(Valider sans rien = Autre)'))||RAY.length;x={id:uid(),name:n,ray:RAY[k-1]||'Autre'};db.ing.push(x);save();return x}
const ingOpts=v=>'<option value="">— Ingrédient —</option>'+db.ing.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(x=>`<option ${x.name==v?'selected':''}>${esc(x.name)}</option>`).join('')+'<option value="__new">➕ Nouvel ingrédient…</option>';
/* ---- logique ---- */
function addShop(r,n){const f=n/r.base;r.ing.forEach(i=>{const k=i.name.trim().toLowerCase(),x=db.shop.find(s=>s.k==k&&s.unit==i.unit&&!s.done);if(x)x.qty+=i.qty*f;else db.shop.push({id:uid(),k,name:i.name,unit:i.unit,qty:i.qty*f,ray:(ing(i.name)||{}).ray||'Autre',done:false})})}
function filt(){let l=db.recipes.filter(r=>(!st.se||!r.se.length||r.se.includes(st.se))&&(!st.fav||r.fav)&&(!st.tag||r.tags.includes(st.tag))&&(!st.q||(r.name+r.tags.join(' ')+r.ing.map(i=>i.name).join(' ')).toLowerCase().includes(st.q.toLowerCase())));
if(st.fr){const w=st.fr.toLowerCase().split(/[,;]/).map(s=>s.trim()).filter(Boolean);l=l.map(r=>({...r,sc:w.length?r.ing.filter(i=>w.some(x=>i.name.toLowerCase().includes(x))).length:0})).filter(r=>r.sc).sort((a,b)=>b.sc/b.ing.length-a.sc/a.ing.length)}return l}
const card=r=>`<button class="card" data-a="open" data-v="${r.id}">${r.photo?`<img src="${r.photo}" alt="">`:'<div class="ph">🍲</div>'}<div class="t"><b>${r.fav?'❤️ ':''}${esc(r.name)}</b><span class="mut">${r.time?r.time+' min · ':''}${r.sc?r.sc+'/'+r.ing.length+' ingrédients · ':''}${r.base} pers.</span></div></button>`;
/* ---- vues ---- */
function vList(){const tags=[...new Set(db.recipes.flatMap(r=>r.tags))];return`<h1>Recettes</h1><input data-i="q" placeholder="Rechercher (nom, ingrédient, tag)" value="${esc(st.q)}">
<div class="row"><button class="chip ${!st.se&&!st.fav?'on':''}" data-a="se" data-v="">Toutes</button>${SE.map(s=>`<button class="chip ${st.se==s?'on':''}" data-a="se" data-v="${s}">${s}${s==NOW?' •':''}</button>`).join('')}<button class="chip ${st.fav?'on':''}" data-a="favf">❤️</button></div>
${tags.length?`<div class="row">${tags.map(t=>`<button class="chip ${st.tag==t?'on':''}" data-a="tag" data-v="${esc(t)}">#${esc(t)}</button>`).join('')}</div>`:''}
<div class="row"><input data-i="fr" placeholder="🧊 Il me reste… (ex : riz, poulet)" value="${esc(st.fr)}"><button class="g" data-a="rnd">🎲 Au hasard</button><button data-a="new">+ Nouvelle</button></div><div class="grid" id="lst">${vGrid()}</div>`}
const vGrid=()=>{const l=filt();return l.length?l.map(card).join(''):'<p class="mut">Aucune recette ici. Crée-en une avec « + Nouvelle » ou change de saison.</p>'};
function vDet(){const r=rec(st.cur),f=st.n/r.base;return`<div class="row"><button class="g" data-a="back">← Retour</button><button class="g" data-a="fav">${r.fav?'❤️':'🤍'}</button><button class="g" data-a="edit">Modifier</button></div>${r.photo?`<img class="hero" src="${r.photo}" alt="">`:''}<h1>${esc(r.name)}</h1><p class="mut">${r.cuis&&r.cuis.length?'⏱ '+cuiTxt(r)+' · ':''}${r.se.length?r.se.join(', '):'Toute l\'année'}${r.tags.length?' · '+r.tags.map(t=>'#'+esc(t)).join(' '):''}</p>
<div class="box stp"><button class="g" data-a="n" data-v="-1">−</button><b>${st.n} pers.</b><button class="g" data-a="n" data-v="1">+</button></div>
<h2>Ingrédients</h2><ul>${r.ing.map(i=>`<li>${fmt(i.qty*f)||''} ${esc(i.unit)} ${esc(i.name)}</li>`).join('')}</ul>
<div class="row"><button data-a="add">🛒 Ajouter aux courses</button><select data-i="plan" style="width:auto"><option value="">📅 Planifier…</option>${DAYS.map(d=>`<option>${d}</option>`).join('')}</select><button data-a="cook">👨‍🍳 Mode cuisine</button></div>
<h2>Étapes</h2><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h2>Notes</h2><textarea data-i="note" rows="3" placeholder="Tes remarques…">${esc(r.note||'')}</textarea><div class="row"><button class="d" data-a="del">Supprimer la recette</button></div>`}
const ingRow=i=>`<div class="ir"><input class="q" inputmode="decimal" placeholder="Qté" value="${i.qty||''}"><select class="u">${opts(UN,i.unit)}</select><input class="nm" data-i="ingin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="🔍 Tape pour chercher un ingrédient" value="${esc(i.name)}"><div class="sg"></div><button class="g" data-a="deli">✕</button></div>`;
function vEdit(){const r=st.edit;return`<h1>${r.name?'Modifier':'Nouvelle recette'}</h1><div id="f"><input id="fn" placeholder="Nom de la recette" value="${esc(r.name)}"><div class="row"><label>Photo <input type="file" accept="image/*" data-i="photo"></label></div><div id="pv">${pvHtml(r.photo)}</div>
<div class="row"><label>Pour combien de personnes ? <input id="fb" type="number" min="1" value="${r.base}"></label></div>
<div class="row">${SE.map(s=>`<label class="chip"><input type="checkbox" style="width:auto" class="fs" value="${s}" ${r.se.includes(s)?'checked':''}> ${s}</label>`).join('')}</div><p class="mut">Aucune saison cochée = toute l'année.</p>
<input id="fg" placeholder="Tags séparés par des virgules (végétarien, rapide…)" value="${esc(r.tags.join(', '))}">
<h2>Cuisson</h2><p class="mut">Ajoute plusieurs étapes si besoin (ex : casserole puis four).</p><div id="cl">${(r.cuis||[]).map(cuiRow).join('')}</div><button class="g" data-a="addc">+ Étape de cuisson</button>
<h2>Ingrédients</h2><div id="il">${r.ing.map(ingRow).join('')}</div><button class="g" data-a="addi">+ Ingrédient</button>
<h2>Étapes (une par ligne)</h2><textarea id="fst" rows="7" placeholder="Ex : Faire cuire 10 min à feu doux">${esc(r.steps.join('\n'))}</textarea>
<div class="row"><button data-a="saver">Enregistrer</button><button class="g" data-a="${r.id&&rec(r.id)?'open':'back'}" data-v="${r.id}">Annuler</button></div></div>`}
function vPlan(){return`<h1>Planning</h1>${DAYS.map(d=>`<div class="box"><b>${d}</b>${(db.plan[d]||[]).map((p,i)=>{const r=rec(p.id);return r?`<div class="row"><button class="g" data-a="open" data-v="${r.id}">${esc(r.name)} (${p.n} pers.)</button><button class="g" data-a="unp" data-v="${d}|${i}">✕</button></div>`:''}).join('')||'<div class="mut">Rien de prévu</div>'}</div>`).join('')}<div class="row"><button data-a="genp">🛒 Tout ajouter aux courses</button><button class="g" data-a="clrp">Vider le planning</button></div>`}
function vShop(){const g={};db.shop.forEach(s=>(g[s.ray||'Autre']=g[s.ray||'Autre']||[]).push(s));return`<h1>Courses</h1><div class="row"><input id="ns" placeholder="Ajouter un article"><button data-a="adds">Ajouter</button></div><div class="shop">${Object.keys(g).sort().map(k=>`<h2>${esc(k)}</h2>${g[k].map(s=>`<label class="${s.done?'done':''}"><input type="checkbox" data-i="chk" data-v="${s.id}" ${s.done?'checked':''}><span style="flex:1">${fmt(s.qty)||''} ${esc(s.unit)} ${esc(s.name)}</span></label>`).join('')}`).join('')||'<p class="mut">Liste vide. Ajoute une recette depuis sa fiche.</p>'}</div><div class="row"><button class="g" data-a="clrc">Retirer les cochés</button><button class="d" data-a="clra">Tout vider</button></div>`}
function vSet(){return`<h1>Réglages</h1><div class="box"><b>Synchronisation GitHub</b><p class="mut">Utilise un dépôt privé et un token « fine-grained » limité à ce dépôt (Contents : lecture/écriture).</p><input id="cr" placeholder="utilisateur/depot" value="${esc(cfg.repo)}"><input id="cp" placeholder="Fichier (recettes.json)" value="${esc(cfg.path)}" style="margin-top:6px"><input id="ct" type="password" placeholder="Token GitHub" value="${esc(cfg.token)}" style="margin-top:6px"><div class="row"><button data-a="cfg">Enregistrer et synchroniser</button></div></div>
<div class="box"><b>Restaurer une version</b><p class="mut">Les 10 dernières sauvegardes du fichier sur GitHub.</p><div class="row"><button class="g" data-a="hist">Afficher l'historique</button></div><div id="hs"></div></div><div class="box"><b>Mes ingrédients</b><p class="mut">Liste unique utilisée dans toutes les recettes et les courses.</p>${db.ing.slice().sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(x=>`<div class="row"><span style="flex:1">${esc(x.name)}</span><select data-i="gray" data-v="${x.id}" style="width:auto">${opts(RAY,x.ray)}</select><button class="g" data-a="gren" data-v="${x.id}">✎</button><button class="g" data-a="gdel" data-v="${x.id}">✕</button></div>`).join('')||'<p class="mut">Aucun ingrédient pour l\'instant.</p>'}<div class="row"><button class="g" data-a="gnew">+ Ingrédient</button></div></div>
<div class="box"><b>Données</b><div class="row"><button class="g" data-a="exp">Exporter le JSON</button><label class="g chip">Importer <input type="file" accept=".json" data-i="imp" hidden></label></div></div>`}
function render(){const t=st.tab;$('#nav').innerHTML=[['r','🍲','Recettes'],['p','📅','Planning'],['s','🛒','Courses'],['c','⚙️','Réglages']].map(([k,i,l])=>`<button class="${t==k?'on':''}" data-a="tab" data-v="${k}">${i}<br>${l}</button>`).join('');
$('#app').innerHTML=st.edit?vEdit():t=='r'?(st.cur&&rec(st.cur)?vDet():vList()):t=='p'?vPlan():t=='s'?vShop():vSet();if(st.cook)cookView()}
/* ---- mode cuisine ---- */
let wl;async function cookView(){const r=rec(st.cur),s=r.steps[st.cook],mm=s.match(/(\d+)\s*min/);let e=$('#ck');if(!e){e=document.createElement('div');e.id='ck';e.className='cook';document.body.append(e)}
e.innerHTML=`<div class="row"><b style="flex:1">Étape ${st.cook+1}/${r.steps.length}</b><button class="g" data-a="cend">Fermer</button></div><p>${esc(s)}</p>${mm?`<div class="row"><button data-a="timer" data-v="${mm[1]}">⏲ Minuteur ${mm[1]} min</button><b id="tm"></b></div>`:''}<div class="row"><button class="g" data-a="cp" ${st.cook?'':'disabled'}>← Précédente</button><button data-a="cn" ${st.cook<r.steps.length-1?'':'disabled'}>Suivante →</button></div>`}
const A={tab:v=>{st.tab=v;st.cur=null;st.edit=null;render()},open:v=>{st.cur=v;st.tab='r';st.edit=null;st.n=rec(v).base;render();scrollTo(0,0)},back:()=>{st.cur=null;st.edit=null;render()},
se:v=>{st.se=v;st.fav=false;render()},favf:()=>{st.fav=!st.fav;st.se='';render()},tag:v=>{st.tag=st.tag==v?'':v;render()},rnd:()=>{const l=filt();l.length?A.open(l[Math.floor(Math.random()*l.length)].id):msg('Aucune recette')},
n:v=>{st.n=Math.max(1,st.n+ +v);render()},fav:()=>{const r=rec(st.cur);r.fav=!r.fav;save();render()},add:()=>{addShop(rec(st.cur),st.n);save();msg('Ajouté aux courses')},
new:()=>{st.edit={id:uid(),name:'',photo:'',base:4,time:0,cuis:[],se:[],tags:[],ing:[{qty:'',unit:'g',name:'',ray:'Autre'}],steps:[]};render()},edit:()=>{st.edit=JSON.parse(JSON.stringify(rec(st.cur)));render()},
